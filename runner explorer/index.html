<!DOCTYPE html>
<html lang="en">
<head>
    <title>RunnerQuest Explorer — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #003594;
            --gold: #FFC72C;
        }
        body { font-family: 'Rajdhani', sans-serif; }
        .game-font { font-family: 'Press Start 2P', monospace; }

        .pixel-border {
            box-shadow:
                4px 0 0 0 var(--gold),
                -4px 0 0 0 var(--gold),
                0 4px 0 0 var(--gold),
                0 -4px 0 0 var(--gold),
                8px 8px 0 0 rgba(0,0,0,0.4);
        }
        .pixel-btn {
            box-shadow: 4px 4px 0 0 rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        .pixel-btn:hover {
            box-shadow: 2px 2px 0 0 rgba(0,0,0,0.5);
            transform: translate(2px, 2px);
        }
        .pixel-btn:active {
            box-shadow: none;
            transform: translate(4px, 4px);
        }
        .pixel-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .bg-grid {
            background-color: #001a4d;
            background-image:
                linear-gradient(rgba(255,199,44,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,199,44,0.05) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .scanline {
            pointer-events: none;
            position: fixed; inset: 0;
            background: linear-gradient(transparent 50%, rgba(0,0,0,0.06) 50%);
            background-size: 100% 4px;
            z-index: 50;
            opacity: 0.4;
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #001133 inset !important;
            -webkit-text-fill-color: white !important;
        }
    </style>
</head>
<body class="bg-grid min-h-screen flex flex-col items-center justify-center px-4 relative">

    <div class="scanline"></div>

    <div class="mb-10 text-center">
        <h1 class="game-font text-xl md:text-3xl leading-relaxed" style="color: white; text-shadow: 3px 3px 0 var(--blue), 0 0 30px rgba(255,199,44,0.3);">
            RUNNER<span style="color: var(--gold);">QUEST</span>
        </h1>
        <h2 class="game-font text-sm md:text-base mt-1" style="color: #a0b8e0;">
            EXPLORER
        </h2>
    </div>

    <div class="pixel-border w-full max-w-sm p-8" style="background: rgba(0, 26, 77, 0.95);">

        <div class="game-font text-xs mb-6" style="color: var(--gold);">
            PLAYER LOGIN
        </div>

        <div id="error-msg" class="hidden game-font mb-4 p-3" style="background: rgba(255,50,50,0.15); color: #ff6b6b; border-left: 3px solid #ff4444; font-size: 8px; line-height: 1.8;">
        </div>

        <form id="login-form" novalidate>
            <div class="mb-4">
                <label class="game-font block mb-2" style="color: #a0b8e0; font-size: 9px;">
                    EMAIL
                </label>
                <input
                    id="email"
                    type="email"
                    placeholder="you@csub.edu"
                    class="w-full px-4 py-3 text-white outline-none text-sm font-semibold"
                    style="background: #001133; border: 2px solid #003594; font-family: 'Rajdhani', sans-serif;"
                    autocomplete="email"
                />
            </div>

            <div class="mb-6">
                <label class="game-font block mb-2" style="color: #a0b8e0; font-size: 9px;">
                    PASSWORD
                </label>
                <input
                    id="password"
                    type="password"
                    class="w-full px-4 py-3 text-white outline-none text-sm font-semibold"
                    style="background: #001133; border: 2px solid #003594; font-family: 'Rajdhani', sans-serif;"
                    autocomplete="current-password"
                />
            </div>

            <button
                id="login-btn"
                type="submit"
                class="pixel-btn w-full py-3 game-font font-bold"
                style="background: var(--gold); color: var(--blue); font-size: 10px;"
            >
                START GAME
            </button>
        </form>

        <div class="mt-6 text-center">
            <span class="text-sm" style="color: #a0b8e0;">New runner? </span>
            <a href="signup.html" class="text-sm font-bold hover:underline" style="color: var(--gold);">
                CREATE ACCOUNT
            </a>
        </div>
    </div>

    <div class="mt-6 game-font" style="color: #1a3a6b; font-size: 8px;">
        CSUB RUNNERQUEST EXPLORER
    </div>

    <script>
        const API = 'https://jvillacorta.cs3680.com/api/auth';

        // redirect if already logged in
        if (localStorage.getItem('rqe_token')) {
            window.location.href = 'game.html';
        }

        // helper functions
        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function clearError() {
            document.getElementById('error-msg').classList.add('hidden');
        }
        function setLoading(loading) {
            const btn = document.getElementById('login-btn');
            btn.disabled = loading;
            btn.textContent = loading ? 'PLEASE WAIT...' : 'START GAME';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('! ALL FIELDS REQUIRED');
                return;
            }

            setLoading(true);

            try {
                const res  = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    showError(`! ${(data.message || 'LOGIN FAILED').toUpperCase()}`);
                    return;
                }

                // jwt to localstorate then go to game.html
                localStorage.setItem('rqe_token', data.token);
                localStorage.setItem('rqe_user', JSON.stringify(data.user));
                window.location.href = 'game.html';

            } catch (err) {
                showError('! COULD NOT REACH SERVER');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>RunnerQuest Explorer — Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #003594;
            --gold: #FFC72C;
        }
        body { font-family: 'Rajdhani', sans-serif; }
        .game-font { font-family: 'Press Start 2P', monospace; }

        .pixel-border {
            box-shadow:
                4px 0 0 0 var(--gold),
                -4px 0 0 0 var(--gold),
                0 4px 0 0 var(--gold),
                0 -4px 0 0 var(--gold),
                8px 8px 0 0 rgba(0,0,0,0.4);
        }
        .pixel-btn {
            box-shadow: 4px 4px 0 0 rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        .pixel-btn:hover {
            box-shadow: 2px 2px 0 0 rgba(0,0,0,0.5);
            transform: translate(2px, 2px);
        }
        .pixel-btn:active {
            box-shadow: none;
            transform: translate(4px, 4px);
        }
        .pixel-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .bg-grid {
            background-color: #001a4d;
            background-image:
                linear-gradient(rgba(255,199,44,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,199,44,0.05) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .scanline {
            pointer-events: none;
            position: fixed; inset: 0;
            background: linear-gradient(transparent 50%, rgba(0,0,0,0.06) 50%);
            background-size: 100% 4px;
            z-index: 50;
            opacity: 0.4;
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #001133 inset !important;
            -webkit-text-fill-color: white !important;
        }
    </style>
</head>
<body class="bg-grid min-h-screen flex flex-col items-center justify-center px-4 relative py-8">

    <div class="scanline"></div>

    <div class="mb-8 text-center">
        <h1 class="game-font text-xl md:text-3xl leading-relaxed" style="color: white; text-shadow: 3px 3px 0 var(--blue);">
            RUNNER<span style="color: var(--gold);">QUEST</span>
        </h1>
        <h2 class="game-font text-sm mt-1" style="color: #a0b8e0;">EXPLORER</h2>
    </div>

    <div id="step-signup" class="pixel-border w-full max-w-sm p-8" style="background: rgba(0, 26, 77, 0.95);">
        <div class="game-font text-xs mb-6" style="color: var(--gold);">
            CREATE ACCOUNT
        </div>

        <div id="signup-error" class="hidden game-font mb-4 p-3" style="background: rgba(255,50,50,0.15); color: #ff6b6b; border-left: 3px solid #ff4444; font-size: 8px; line-height: 1.8;">
        </div>

        <form id="signup-form" novalidate>

            <div class="mb-4">
                <label class="game-font block mb-2" style="color: #a0b8e0; font-size: 9px;">
                    CSUB EMAIL
                </label>
                <input
                    id="email"
                    type="email"
                    placeholder="you@csub.edu"
                    class="w-full px-4 py-3 text-white outline-none text-sm font-semibold"
                    style="background: #001133; border: 2px solid #003594; font-family: 'Rajdhani', sans-serif;"
                />
                <div id="email-hint" class="mt-1" style="color: #4a6fa5; font-size: 10px; font-family: 'Rajdhani', sans-serif;">
                    Must end in @csub.edu
                </div>
            </div>

            <div class="mb-4">
                <label class="game-font block mb-2" style="color: #a0b8e0; font-size: 9px;">
                    PASSWORD
                </label>
                <input
                    id="password"
                    type="password"
                    placeholder="min. 6 characters"
                    class="w-full px-4 py-3 text-white outline-none text-sm font-semibold"
                    style="background: #001133; border: 2px solid #003594; font-family: 'Rajdhani', sans-serif;"
                />
            </div>

            <div class="mb-6">
                <label class="game-font block mb-2" style="color: #a0b8e0; font-size: 9px;">
                    CONFIRM PASSWORD
                </label>
                <input
                    id="confirm"
                    type="password"
                    placeholder="repeat password"
                    class="w-full px-4 py-3 text-white outline-none text-sm font-semibold"
                    style="background: #001133; border: 2px solid #003594; font-family: 'Rajdhani', sans-serif;"
                />
            </div>

            <button
                id="signup-btn"
                type="submit"
                class="pixel-btn w-full py-3 game-font font-bold"
                style="background: var(--gold); color: var(--blue); font-size: 10px;"
            >
                JOIN THE QUEST
            </button>
        </form>

        <div class="mt-6 text-center">
            <span class="text-sm" style="color: #a0b8e0;">Already a runner? </span>
            <a href="index.html" class="text-sm font-bold hover:underline" style="color: var(--gold);">
                LOGIN →
            </a>
        </div>
    </div>

    <div class="mt-6 game-font" style="color: #1a3a6b; font-size: 8px;">
        CSUB RUNNERQUEST EXPLORER
    </div>

    <script>
        const API = 'https://jvillacorta.cs3680.com/api/auth';

        // check localstorage for login token, if so redirect to game.html
        if (localStorage.getItem('rqe_token')) {
            window.location.href = 'game.html';
        }

        // helper functions
        function showSignupError(msg) {
            const el = document.getElementById('signup-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function clearSignupError() {
            document.getElementById('signup-error').classList.add('hidden');
        }

        function setLoading(btnId, loading, label) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.textContent = loading ? 'PLEASE WAIT...' : label;
        }

        // give hints to the user that the email has to be a CSUB one
        document.getElementById('email').addEventListener('input', function () {
            const val  = this.value.trim();
            const hint = document.getElementById('email-hint');
            if (val.length === 0) {
                this.style.borderColor = '#003594';
                hint.style.color = '#4a6fa5';
                hint.textContent = 'Must end in @csub.edu';
            } else if (val.endsWith('@csub.edu')) {
                this.style.borderColor = '#22c55e';
                hint.style.color = '#4ade80';
                hint.textContent = 'Valid CSUB email';
            } else {
                this.style.borderColor = '#ef4444';
                hint.style.color = '#f87171';
                hint.textContent = 'Must end in @csub.edu';
            }
        });

        // signup, hitting api endpoint after gathering all data
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearSignupError();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm  = document.getElementById('confirm').value;

            // client side validation
            if (!email || !password || !confirm) {
                showSignupError('! ALL FIELDS REQUIRED');
                return;
            }
            if (!email.endsWith('@csub.edu')) {
                showSignupError('! EMAIL MUST END IN @CSUB.EDU');
                return;
            }
            if (password.length < 6) {
                showSignupError('! PASSWORD MIN 6 CHARACTERS');
                return;
            }
            if (password !== confirm) {
                showSignupError('! PASSWORDS DO NOT MATCH');
                return;
            }

            setLoading('signup-btn', true, 'JOIN THE QUEST');

            try {
                const res  = await fetch(`${API}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                console.log('status:', res.status);
                console.log('response:', data);

                if (!res.ok) {
                    // grab error message 
                    showSignupError(`! ${(data.message || 'SIGNUP FAILED').toUpperCase()}`);
                    return;
                }

                // success — go straight to login
                window.location.href = 'index.html';

            } catch (err) {
                showSignupError('! COULD NOT REACH SERVER');
            } finally {
                setLoading('signup-btn', false, 'JOIN THE QUEST');
            }
        });
    </script>
</body>
</html>
